name: Cerberus Tech, Inc.
description: 'Cerberus Tech, Inc. (C7 Security) is a Central Asian cybersecurity firm
  combining practical offensive security with research-backed methodology. Its flagship
  product, Cerberus, is an IDE and programming language purpose-built for ethical
  hackers to run faster penetration-testing assessments. Services span security assessment
  (penetration testing, audits, red teaming), secure development (code, design, and
  architecture reviews), OSINT reconnaissance, R&D grounded in type theory, and consulting.
  The company also runs C7 Academy, an elite penetration-testing training program,
  alongside free education and community initiatives. It reports 150+ security audits
  with a 95%+ penetration rate and 300+ students trained. Backed by 500 Global; surfaced
  to the API Evangelist network as a portfolio lead.'
